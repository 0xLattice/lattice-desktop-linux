name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The app as it ships: the node built at the pinned commit, the shared app
  # packaged around it, every test of the shared app run on Linux, and the
  # installed package launched.
  build:
    runs-on: ubuntu-22.04
    container: swift:6.1-jammy
    timeout-minutes: 120
    env:
      E2E_TIME_SCALE: 3
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: git config --global --add safe.directory '*'
      - run: scripts/install-build-dependencies.sh
      - run: scripts/build-node-binaries.sh
      - run: scripts/build-app.sh
      - run: scripts/test.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-desktop-linux-amd64
          path: dist/
          if-no-files-found: error
