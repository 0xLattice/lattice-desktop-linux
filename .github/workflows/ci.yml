name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The app as it ships: the node built at the pinned commit, the shared app
  # packaged around it, every test of the shared app run on Linux, and the
  # installed package launched.
  build:
    runs-on: ubuntu-22.04
    container: swift:6.1-jammy
    timeout-minutes: 120
    env:
      E2E_TIME_SCALE: 3
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: git config --global --add safe.directory '*'
      - run: scripts/install-build-dependencies.sh
      - run: scripts/build-node-binaries.sh
      - run: scripts/build-app.sh
      - run: scripts/test.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-desktop-linux-amd64
          path: dist/
          if-no-files-found: error

  # GPU mining with the binaries the package installs, on a second
  # distribution: the shared app's mining test (its page, with the test's
  # stand-in for the shell) against the installed node and GPU worker. A
  # runner has no graphics chip, so the worker searches on PoCL (OpenCL on the
  # processor), which LATTICE_MINER_OPENCL_DEVICES=all lets it use: the same
  # worker, kernel and mining loop as on a graphics chip. (The build image's
  # PoCL is too old to know a current runner's processor.)
  gpu-mining:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_TIME_SCALE: 3
      LATTICE_MINER_OPENCL_DEVICES: all
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: lattice-desktop-linux-amd64
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ./dist/*.deb pocl-opencl-icd
      - run: scripts/test-gpu-mining.sh /usr/lib/Lattice/bin
      - name: Disposable peer-format upgrade and rollback fixtures
        run: |
          old="$RUNNER_TEMP/lattice-old"
          mkdir -p "$old"
          curl -fL https://github.com/0xLattice/lattice-desktop-linux/releases/download/v0.1.0/Lattice_0.1.0_amd64.deb -o "$old/package.deb"
          echo "24451008ab68bd8426e0951b9464019175d5fc930fa98656ccb38ae72999b809  $old/package.deb" | sha256sum -c -
          dpkg-deb -x "$old/package.deb" "$old/package"
          python3 test/peer-format.py /usr/lib/Lattice/bin/lattice "$old/package/usr/lib/Lattice/bin/lattice"

  # The installed app in its own window, driven through WebDriver: a wallet,
  # the node the app starts, mining, a transfer, and the common mistakes on
  # the way, with nothing standing in for the shell or the node.
  ui:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: lattice-desktop-linux-amd64
          path: dist
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ./dist/*.deb webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: scripts/test-ui.sh
      - name: Native release navigation and lock keyboard checks
        run: LATTICE_UI_TEST_FILE="$PWD/test/release-ui.test.mjs" scripts/test-ui.sh
      - name: Check bundled notices and AppImage runtime
        run: |
          test -s /usr/lib/Lattice/THIRD-PARTY-NOTICES.txt
          chmod +x dist/*.AppImage
          cd dist
          ./Lattice_*.AppImage --appimage-extract >/dev/null
          test -s squashfs-root/usr/lib/Lattice/THIRD-PARTY-NOTICES.txt
          ../scripts/test-ui.sh "$PWD/squashfs-root/AppRun" "$PWD/squashfs-root/usr/lib/Lattice/bin"
          LATTICE_UI_TEST_FILE="$GITHUB_WORKSPACE/test/release-ui.test.mjs" ../scripts/test-ui.sh "$PWD/squashfs-root/AppRun" "$PWD/squashfs-root/usr/lib/Lattice/bin"
